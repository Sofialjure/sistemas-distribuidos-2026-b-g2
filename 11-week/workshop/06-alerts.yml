groups:
  - name: document-generation-slo
    rules:
      - alert: DocumentGenerationFastBurn
        expr: |
          (
            sum(rate(document_generation_requests_total{status="error"}[1h]))
            /
            sum(rate(document_generation_requests_total[1h]))
          ) / (1 - 0.995) > 14.4
        for: 5m
        labels:
          severity: critical
          team: document-generation
        annotations:
          summary: "Generate Consultation Document está quemando rápidamente su Error Budget"
          description: "La tasa de error supera 14.4 veces el presupuesto durante 1h y se ha mantenido por 5m."
          runbook_url: "https://github.com/code-corhuila/telemed-ia-docs/blob/main/11-week/workshop/07-runbook.md"

      - alert: DocumentGenerationSlowBurn
        expr: |
          (
            sum(rate(document_generation_requests_total{status="error"}[6h]))
            /
            sum(rate(document_generation_requests_total[6h]))
          ) / (1 - 0.995) > 6
        for: 30m
        labels:
          severity: warning
          team: document-generation
        annotations:
          summary: "Generate Consultation Document está consumiendo el Error Budget de forma sostenida"
          description: "La tasa de error supera 6 veces el presupuesto durante 6h y se ha mantenido por 30m."
          runbook_url: "https://github.com/code-corhuila/telemed-ia-docs/blob/main/11-week/workshop/07-runbook.md"

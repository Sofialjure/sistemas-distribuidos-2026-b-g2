# Blue-green front door: only the color named in active.inc receives traffic.
include /etc/nginx/conf.d/active.inc;

server {
    listen 80;
    location / {
        proxy_pass http://professional_management;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_next_upstream error timeout http_502 http_503;
        add_header X-Served-By $served_by always;
    }
}
